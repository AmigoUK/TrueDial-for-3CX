name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm compile

      - name: Unit tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Package extension
        run: pnpm zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: truedial-chrome-mv3
          path: .output/*.zip
          if-no-files-found: error
