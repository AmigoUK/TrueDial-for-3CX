name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Lets a stuck or flaky run be repeated from the Actions tab without pushing
  # an empty commit — `gh run rerun` only works once a run has finished.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A healthy run takes two to four minutes. The cap exists so a hung step
    # fails fast instead of holding the runner for the six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm compile

      - name: Unit tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Package extension
        run: pnpm zip

      # Runs against the production package, before the E2E variant overwrites
      # .output: manifest version against package.json, icon dimensions, the
      # locale set, unexpected permissions, a hoisted host_permissions, a static
      # content script, stray source maps. Every one of those costs a review
      # round if it reaches the store.
      - name: Verify package
        run: pnpm store:check

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: truedial-chrome-mv3
          path: .output/*.zip
          if-no-files-found: error
          # .output is a dot-directory; without this the glob silently matches
          # nothing and the upload fails.
          include-hidden-files: true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Deliberately WITHOUT --with-deps. That flag runs apt, and the runners'
      # Ubuntu mirrors stalled this step for eight minutes on two consecutive
      # attempts, after which nothing else ran. The runner image already carries
      # the browser libraries; if one ever goes missing, the E2E step below
      # fails with the library named, which beats hanging on a mirror. The cap
      # stays so a slow download names itself.
      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: pnpm exec playwright install chromium

      # Rebuilds .output with the E2E variant — runs AFTER the production
      # package has been zipped and uploaded above.
      - name: Smoke E2E
        run: pnpm e2e
